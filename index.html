<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>展開馬場</title>
<style>
  :root { --bg:#f4f1ea; --fg:#1a1a18; --muted:#6b6860; --line:#d9d4c8; --warn:#9a1f1f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:18px; font-weight:650; margin:0; }
  h2 { font-size:13px; font-weight:650; margin:28px 0 8px; }
  p, td { font-size:14px; }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); font-weight:650; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  hr { border:0; border-top:1px solid var(--line); margin:20px 0; }
  table { width:100%; border-collapse:collapse; }
  td { border-top:1px solid var(--line); padding:8px 4px; vertical-align:top; }
  .mono { font-family:ui-monospace,monospace; color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border:1px solid var(--line); font-size:12px; }
</style>
</head>
<body>
<main id="app"><p class="muted">公式を読んでいます。</p></main>
<script>
function stamp(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.getMonth()+1 + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
}
fetch("./data.json", { cache: "no-store" })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var turf = (d.turf || []).map(function(row) {
      return "<tr><td class=\"mono\">" + row.time + "</td><td>" + row.n + "R</td><td>" + row.name + "</td><td>" + row.status + (row.check ? "　" + row.check + "回目" : "") + "</td><td class=\"muted\">" + (row.detail || row.note || "") + "</td></tr>";
    }).join("");
    document.getElementById("app").innerHTML =
      '<div class="row"><div><h1>' + d.label + '</h1><p class="muted">' + d.course + "　" + d.post + '</p></div><span class="pill ' + (d.stale ? "warn" : "") + '">' + (d.stale ? "未更新" : "最新") + "</span></div>" +
      '<p class="' + (d.stale ? "warn" : "") + '">クッション ' + (d.cushion != null ? d.cushion : "—") + "　" + stamp(d.cushion_at) + (d.reason ? "　" + d.reason : "") + "</p>" +
      "<p>チーフ　" + (d.chief || "—") + "</p>" +
      '<p class="muted">枠時点では単勝を決めない。2回目の芝を見るまで買いを置かない。</p><hr />' +
      "<h2>当日の芝（全部が材料）</h2>" +
      '<p class="muted">見るのは4角先頭が残ったか。着順では書かない。</p>' +
      "<table><tbody>" + turf + "</tbody></table>" +
      "<h2>判定の更新</h2><p>1回目は13時台の芝のあと。2回目は本番直前の芝のあと。</p>" +
      '<p class="muted">公式のクッションと4角だけ。Xは票にしない。取れなければ空欄。取得 ' + stamp(d.fetched_at) + "</p>";
  })
  .catch(function() {
    document.getElementById("app").innerHTML = '<p class="warn">data.json を読めない。推測しない。</p>';
  });
</script>
</body>
</html>
